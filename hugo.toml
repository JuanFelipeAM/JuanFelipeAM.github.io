#URL = '/teaching/current'
#parent = 'Teaching'
#weight = 3

[[languages.en.menus.header]]
name = "CV"
URL = "/CV"
weight = 4

[[languages.en.menus.header]]
pre = "email"
name = "email"
URL = "#contact"
weight = 5

[[languages.en.menus.header]]
pre = "search"
name = "Search"
URL = "/search"
weight = 6

[[languages.en.menus.footer]] ## Keeping for template if footer menu wanted
name = "Home"
URL = "/"
weight = 1


#[languages.es] ## Keeping for template of other languages
#disabled = false
#locale = 'es'
#direction = 'ltr'
#label = 'Español'
#weight = 0


# Plugins
[params.plugins]

# CSS Plugins
[[params.plugins.css]]
URL = "css/custom.css"
[[params.plugins.css]]
URL = "css/adritian-icons.css"
## Print css
[[params.plugins.css]]
URL = "css/bootstrap-print.css"

# JS Plugins
[[params.plugins.js]]
URL = "js/rad-animations.js"
[[params.plugins.js]]
URL = "js/sticky-header.js"
[[params.plugins.js]]
URL = "js/library/fontfaceobserver.js"

# SCSS Plugins
[[params.plugins.scss]]
URL = "scss/adritian.scss"


# theme/color style 
[params.colorTheme]

## the following configuration would disable automatic theme selection
#  [params.colorTheme.auto]
#    disable = true
#  [params.colorTheme.forced]
#    theme = "dark"

## the following parameter will disable theme override in the footer
#  [params.colorTheme.selector.disable]
#  footer = true

# Color theme selector visibility — set to true to hide in that location
[params.colorTheme.selector.disable]
footer = false
header = true
mobileHeader = true
## by default we allow override AND automatic selection

# View Transitions API - enabled by default
# Set to false to disable the native View Transitions API
# viewTransitions = false

[params.sharing] ## Not sure what this does
bluesky = false
mastodon = false

[params.blog]
layout = "sidebar-right"     # options: default (no sidebar), sidebar, sidebar-right
sidebarWidth = "25"    # percentage width of the sidebar
narrowContent = true   # if true, limits content width to 720px for better readability
showCategories = true
showRecentPosts = true
recentPostCount = 5
listStyle = "summary"  # options: simple, summary
listLayout = "default" # options: default, cards
featured_sort_by_weight = true
featured_sort_by_date = false


[params.experience]
showJobCard = true # Set to false to hide the job card

# Navbar overflow handling - options: "dropdown" | "footer" | "none"
[params.navbarOverflow]
mode = "dropdown" # "dropdown" moves items to More dropdown, "footer" moves to footer, "none" disables


# Performance optimizations
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    lineNos = false
    noClasses = false
    style = "github"

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Smart"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepDefaultAttrVals = true
      keepWhitespace = false
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0


### Adding my own parameters and controls

[[cascade]]
[cascade.params]
hideBreadcrumb = true # This toggles the breadcrumbs navigation bar


[params.header]
hideEmailButton = true # This toggles the email button in the menu bar
hideSearchButton = true # This toggles the search button in the menu bar

[params.footer]
showMenu = false

