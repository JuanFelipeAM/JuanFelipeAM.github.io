{{ define "main" }}
  <div id="teaching" class="section--fullheight rad-animation-group flex-grow-1">
    <div id="main-content">
      {{ if not .Params.hideTitle }}  
      <h1 id="title">{{ .Title }}</h1>
      {{ end }}
      <article id="content">
        {{ .Content }}
      </article>
    </div>
  </div>
{{ end }}
