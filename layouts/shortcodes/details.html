{{- $summary := .Get "summary" | default "Details" -}}
{{- $summaryClass := .Get "summaryClass" | default "" -}}
{{- $open := .Get "open" -}}
<details{{ if $open }} open{{ end }}>
  <summary{{ with $summaryClass }} class="{{ . }}"{{ end }}>{{ $summary }}</summary>
  {{ .Inner | markdownify }}
</details>
