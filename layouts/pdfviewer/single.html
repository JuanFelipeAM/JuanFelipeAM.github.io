{{ define "main" }}

<div id="pdfEmbed" class="pdf-embed">
	<iframe
    id="pdfFrame"
    aria-label="PDF Viewer">
  </iframe>
</div>

<script>
  const pdfEmbed = document.getElementById("pdfEmbed");
  const pdfFrame = document.getElementById("pdfFrame");
  const notFoundUrl = "{{ "/404.html" | relURL }}";
  const fileBase = "{{ "/files/" | relURL }}";

  function showNotFound() {
    pdfEmbed.hidden = true;
    fetch(notFoundUrl)
      .then(response => {
        if (!response.ok && response.status !== 404) {
          throw new Error("Unable to load 404 page");
        }
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.open();
        document.write("<!doctype html><html><head><title>404 Page not found</title></head><body><main><h1>404</h1><h2>Page not found</h2></main></body></html>");
        document.close();
      });
  }

  const rawQuery = window.location.search;
  const validQuery = /^\?file=([^&]+)$/.test(rawQuery)
    && !/%(?:[^0-9A-Fa-f]|$)/.test(rawQuery);
  const params = new URLSearchParams(rawQuery);
  const file = params.get("file");

  if (!validQuery || !file) {
    showNotFound();
  } else {
    const segments = file.replace(/\\/g, "/").split("/");

    if (!segments.every(segment => segment && segment !== "." && segment !== "..")) {
      showNotFound();
    } else {
      const pdfUrl = fileBase + segments.map(encodeURIComponent).join("/");
      fetch(pdfUrl, { method: "HEAD", cache: "no-store" })
        .then(response => {
          if (!response.ok) {
            showNotFound();
            return;
          }

          const contentType = response.headers.get("Content-Type") || "";
          if (!contentType.toLowerCase().includes("application/pdf")) {
            showNotFound();
            return;
          }

          pdfFrame.src = pdfUrl;
        })
        .catch(showNotFound);
    }
  }
</script>

{{ end }}
