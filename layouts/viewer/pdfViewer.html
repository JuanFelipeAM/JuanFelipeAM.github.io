{{ define "main" }}

<div style="width:100%; height:90vh;">
  <iframe
    id="pdfFrame"
    width="100%"
    height="100%"
    style="border:none;">
  </iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const queryFile = params.get("file");
  const configuredFile = "{{ .Params.pdfFile }}";
  const file = queryFile || configuredFile;

  if (file) {
    const encodedFile = file.split("/").map(encodeURIComponent).join("/");
    document.getElementById("pdfFrame").src = "{{ .Site.BaseURL }}files/" + encodedFile;
  } else {
    document.body.innerHTML = "<h2>No PDF specified.</h2>";
  }
</script>

{{ end }}
